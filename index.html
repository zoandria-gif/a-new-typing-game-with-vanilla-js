<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JavaType — Maîtrisez Java en tapant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>
 <!-- SIDEBAR -->
<aside id="sidebar">
  <div class="sidebar-logo">
    <a class="logo-mark" href="#" onclick="return false">
      <div class="logo-icon">JT</div>
      <span class="logo-text">Java<span>Type</span></span>
    </a>
  </div>

  <!-- Quick shortcuts  -->
  <div class="sidebar-quick">
    <button class="quick-btn" onclick="startGame('easy')">▶ Facile</button>
    <button class="quick-btn" onclick="startGame('medium')">▶ Moyen</button>
    <button class="quick-btn" onclick="startGame('hard')">▶ Difficile</button>
  </div>

  <nav class="sidebar-nav">
    <div class="nav-section-label">Navigation</div>
    <button class="nav-item active" data-page="home">
      <span class="nav-icon">🏠</span> Accueil
    </button>
    <button class="nav-item" data-page="game">
      <span class="nav-icon">⌨️</span> Jeu
      <span class="nav-badge">▶</span>
    </button>
    <button class="nav-item" data-page="about">
      <span class="nav-icon">👥</span> À Propos
    </button>
    <button class="nav-item" data-page="settings">
      <span class="nav-icon">⚙️</span> Paramètres
    </button>
    <button class="nav-item" data-page="login" id="nav-login">
      <span class="nav-icon">🔑</span> Connexion
    </button>
  </nav>

  <!-- User badge -->
  <div id="user-badge">
    <div class="ub-avatar" id="ub-avatar-el"><span id="ub-initials">?</span></div>
    <div class="ub-info">
      <div class="ub-name" id="ub-name-el">Utilisateur</div>
      <div class="ub-status">connecté</div>
    </div>
    <button class="ub-logout" onclick="logout()">⏏</button>
  </div>

  <div class="sidebar-footer">
    <div class="sidebar-theme-toggle">
      <span>Mode sombre</span>
      <div class="toggle-switch on" id="theme-toggle" onclick="toggleTheme()"></div>
    </div>
  </div>
</aside>


    <script src="script.js"></script>
</body>

</html>
